<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wood Order</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="header-wrapper">
        <h1 class="page-title">Sawyer Inventory</h1>
    </div>
    <div class="grid-container">
        <div class="wood-item">
            <p class="item-title-description">Piece<br></p>
            <p class="item-title-species">Maple<br></p>
            <img src="/D:/Anime/1hy4x0ljBTMhsIwzPKm2O_1IE20bZkYNx93Qx4e_08I.jpg" alt="Maple" class="wood-image" onerror="this.onerror=null;this.src='images/default.jpg';">
            <p class="item-price">$84.52<br></p>
            <p>6'-9" x 1'-10" x 8/4"<br>8 in stock</p>
        </div>
        <div class="wood-item">
            <p class="item-title-description">Log<br></p>
            <p class="item-title-species">Walnut<br></p>
            <img src="/D:/Anime/8etdw675nrg71.jpg" alt="Walnut" class="wood-image" onerror="this.onerror=null;this.src='images/default.jpg';">
            <p class="item-price">$2.03<br></p>
            <p>7'-6" x 4'-3" x 2/4"<br>52 in stock</p>
        </div>
        <div class="wood-item">
            <p class="item-title-description">Bulk<br></p>
            <p class="item-title-species">Birch<br></p>
            <img src="/D:/Anime/300.jpg" alt="Birch" class="wood-image" onerror="this.onerror=null;this.src='images/default.jpg';">
            <p class="item-price">$0.39<br></p>
            <p>7'-5" x 9'-7" x 1/4"<br>53 in stock</p>
        </div>
        <div class="wood-item">
            <p class="item-title-description">Piece<br></p>
            <p class="item-title-species">Maple<br></p>
            <img src="/EmptyString" alt="Maple" class="wood-image" onerror="this.onerror=null;this.src='images/default.jpg';">
            <p class="item-price">$1.16<br></p>
            <p>12'-0" x 1'-5" x 3/4"<br>12 in stock</p>
        </div>
    </div>
</body>
</html>
